  lifter_controller:
    type: engineer_lifter_controller/EngineerLifterController
    lift_position: -0.27
    lift_vel: 0.02
    up_move_vel: -20.0
    down_ready_effort: -30.0

    lifter:
      left:
        joint: left_lifter_joint
        pid: { p: 16000, i: 100, d: 450, i_clamp_max: 50.0, i_clamp_min: -50., antiwindup: true, publish_state: true }
      right:
        joint: right_lifter_joint
        pid: { p: 16000, i: 100, d: 450, i_clamp_max: 50.0, i_clamp_min: -50., antiwindup: true, publish_state: true }
    wheel:
      left:
        joint: left_lifter_wheel_joint
        pid: { p: 0.5, i: 0.001, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true, publish_state: false }
      right:
        joint: right_lifter_wheel_joint
        pid: { p: 0.5, i: 0.001, d: 0.0, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true, publish_state: false }

  ######################### Calibration Controllers ######################
#  joint4_fix_command_controller:
