controllers:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100
  robot_state_controller:
    type: robot_state_controller/RobotStateController
    publish_rate: 100

  arm_trajectory_controller:
    type: effort_controllers/JointTrajectoryController
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    gains:
      joint1: { p: 16000.0, i: 10, d: 580.0, i_clamp_max: 20, i_clamp_min: -20, antiwindup: true, publish_state: true }
      joint2: { p: 60.0, i: 0.01, d: 1.8, i_clamp_max: 7, i_clamp_min: -7, antiwindup: true, publish_state: true }
      joint3: { p: 130.0, i: 90.0, d: 2.5, i_clamp_max: 0, i_clamp_min: -16, antiwindup: true, publish_state: true }
      joint4: { p: 135.0, i: 80.0, d: 7.8, i_clamp_max: 0, i_clamp_min: -9, antiwindup: true, publish_state: true }
      joint5: { p: 25.0, i: 1.0, d: 0.4, i_clamp_max: 2, i_clamp_min: -2, antiwindup: true, publish_state: true }
      joint6: { p: 20.0, i: 5.0, d: 0.4, i_clamp_max: 1, i_clamp_min: -1, antiwindup: true, publish_state: true }
      joint7: { p: 20.0, i: 1.0, d: 0.4, i_clamp_max: 2, i_clamp_min: -2, antiwindup: true, publish_state: true }
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.05
      joint1: { trajectory: 0.08, goal: 0.05 }
      joint2: { trajectory: 0.08, goal: 0.05 }
      joint3: { trajectory: 0.08, goal: 0.05 }
      joint4: { trajectory: 0.08, goal: 0.05 }
      joint5: { trajectory: 0.08, goal: 0.05 }
      joint6: { trajectory: 0.08, goal: 0.05 }
      joint7: { trajectory: 0.08, goal: 0.05 }

  chassis_controller:
    type: rm_chassis_controllers/OmniController
    # ChassisBase
    publish_rate: 100
    enable_odom_tf: true
    publish_odom_tf: true
    power:
      effort_coeff: 5.0
      vel_coeff: 0.006
      power_offset: -9.8
    twist_angular: 0.5233
    timeout: 0.1
    pid_follow: { p: 4.0, i: 0, d: 0.02, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true, publish_state: false }
    twist_covariance_diagonal: [ 0.001, 0.001, 0.001, 0.001, 0.001, 0.001 ]
    max_odom_vel: 10.0
    # OmniController
    wheels:
      left_front:
        pose: [ 0.213, 0.1945, 0. ]
        roller_angle: -0.785
        joint: left_front_wheel_joint
        <<: &wheel_setting
          radius: 0.07
          pid: { p: 0.6, i: 0.0, d: 0.0, i_clamp_max: 0.0, i_clamp_min: 0.0, antiwindup: true, publish_state: false }
      right_front:
        pose: [ 0.213, -0.1945, 0. ]
        roller_angle: 0.785
        joint: right_front_wheel_joint
        <<: *wheel_setting
      left_back:
        pose: [ -0.213, 0.1945, 0. ]
        roller_angle: 0.785
        joint: left_back_wheel_joint
        <<: *wheel_setting
      right_back:
        pose: [ -0.213, -0.1945, 0. ]
        roller_angle: -0.785
        joint: right_back_wheel_joint
        <<: *wheel_setting


