#      joint: joint4
#      pid: { p: 65., i: 20., d: 4.0, i_clamp_max: 0., i_clamp_min: -8., antiwindup: true, publish_state: true }
  joint1_calibration_controller:
    type: rm_calibration_controllers/MechanicalCalibrationController
    actuator: [ joint1_motor ]
    velocity:
      search_velocity: 0.6
      vel_threshold: 0.001
      joint: joint1
      pid: { p: 200, i: 0, d: 0, i_clamp_max: 0.0, i_clamp_min: 0, antiwindup: true, publish_state: false }

  left_lifter_calibration_controller:
    type: rm_calibration_controllers/MechanicalCalibrationController
    actuator: [ left_lifter_motor ]
    velocity:
      search_velocity: 1.0
      vel_threshold: 0.001
      joint: left_lifter_joint
      pid: { p: 100, i: 0, d: 0, i_clamp_max: 0.0, i_clamp_min: 0, antiwindup: true, publish_state: false }

  right_lifter_calibration_controller:
    type: rm_calibration_controllers/MechanicalCalibrationController
    actuator: [ right_lifter_motor ]
    velocity:
      search_velocity: 1.0
      vel_threshold: 0.001
      joint: right_lifter_joint
      pid: { p: 100, i: 0, d: 0, i_clamp_max: 0.0, i_clamp_min: 0, antiwindup: true, publish_state: false }

