  gripper_controller:
    type: gripper_controller/GripperController
    joint: gripper_joint
    max_position: 0.011
    min_position: 0.915
    opening:
      pid: { p: 10.0, i: 2.0, d: 0.7, i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup: true, publish_state: false }
    closing:
      velocity_threshold: 0.1
      position_threshold: 0.03
      holding_effort: 2.0
      pid: { p: 3.0, i: 0.0, d: 0.4, i_clamp_max: 2.0, i_clamp_min: -2.0, antiwindup: true, publish_state: false }

